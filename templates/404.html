<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | Futsal</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        .error-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .error-card {
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding: 50px 30px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .error-number {
            font-size: 100px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 15px;
        }

        .error-card h1 {
            margin-bottom: 12px;
        }

        .error-card p {
            margin-bottom: 25px;
            color: #666;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            background: #6c5ce7;
            color: white;
        }

        .home-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="error-page">
        <div class="error-card">

            <div class="error-number">
                404
            </div>

            <h1>Page Not Found</h1>

            <p>
                Sorry, the page you are looking for
                does not exist or may have been moved.
            </p>

            <a
                href="{{ url_for('index') }}"
                class="home-btn"
            >
                Go Back Home
            </a>

        </div>
    </div>

</body>
</html>
