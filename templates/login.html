<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Futsal Booking</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;

            font-size: 42px;

            margin-bottom: 10px;
        }

        h1 {
            text-align: center;

            color: #172033;

            margin-bottom: 8px;

            font-size: 30px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            margin-bottom: 30px;

            font-size: 15px;
        }

        .alert {
            padding: 13px 15px;

            border-radius: 10px;

            margin-bottom: 18px;

            background: #fee2e2;

            color: #991b1b;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #334155;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        .login-button {
            width: 100%;

            border: none;

            background: #2563eb;

            color: white;

            padding: 14px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .links {
            text-align: center;

            margin-top: 25px;

            color: #64748b;

            font-size: 14px;
        }

        .links a {
            color: #2563eb;

            text-decoration: none;

            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #64748b;

            text-decoration: none;

            font-size: 14px;
        }

        .home-link:hover {
            color: #2563eb;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            ⚽
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to your Futsal Booking account
        </p>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- LOGIN FORM -->

        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <!-- CSRF TOKEN -->

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="login-button"
            >
                🔐 Login
            </button>

        </form>


        <!-- REGISTER -->

        <div class="links">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </div>


        <!-- HOME -->

        <a
            href="{{ url_for('index') }}"
            class="home-link"
        >
            ← Back to Home
        </a>

    </div>

</body>

</html>
