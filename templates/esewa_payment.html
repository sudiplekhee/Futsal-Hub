<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>eSewa Payment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f7ff,
                    #ffffff
                );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .payment-container {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 10px;

            color: #6c5ce7;
        }

        h1 {
            text-align: center;

            margin: 0 0 25px;

            font-size: 24px;

            color: #222;
        }

        .booking-info {
            background: #f8f9ff;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 25px;
        }

        .row {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 8px 0;

            border-bottom:
                1px solid #eeeeee;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #666;
        }

        .value {
            font-weight: bold;

            color: #222;

            text-align: right;
        }

        .amount {
            font-size: 24px;

            color: #00a86b;
        }

        .pay-button {
            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 15px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background: #60bb46;

            color: white;

            transition: 0.2s;
        }

        .pay-button:hover {
            background: #4da638;
        }

        .cancel-button {
            display: block;

            text-align: center;

            margin-top: 15px;

            text-decoration: none;

            color: #666;
        }

        .cancel-button:hover {
            color: #333;
        }

        .notice {
            margin-top: 20px;

            padding: 12px;

            background: #fff8e6;

            border-radius: 8px;

            color: #795500;

            font-size: 13px;

            line-height: 1.5;
        }

    </style>
</head>

<body>

<div class="payment-container">

    <div class="logo">
        ⚽ Futsal
    </div>

    <h1>
        eSewa Payment
    </h1>

    <div class="booking-info">

        <div class="row">

            <span class="label">
                Ground
            </span>

            <span class="value">
                {{ booking['ground_name'] }}
            </span>

        </div>


        <div class="row">

            <span class="label">
                Date
            </span>

            <span class="value">
                {{ booking['booking_date'] }}
            </span>

        </div>


        <div class="row">

            <span class="label">
                Time
            </span>

            <span class="value">
                {{ booking['booking_time'] }}
            </span>

        </div>


        <div class="row">

            <span class="label">
                Duration
            </span>

            <span class="value">
                {{ duration }} hour(s)
            </span>

        </div>


        <div class="row">

            <span class="label">
                Amount
            </span>

            <span class="value amount">
                Rs. {{ "%.2f"|format(total_amount) }}
            </span>

        </div>

    </div>


    <!--
        IMPORTANT:
        This form sends the required eSewa
        ePay V2 fields.
    -->

    <form
        action="{{ esewa_payment_url }}"
        method="POST"
    >

        <!-- Amount -->

        <input
            type="hidden"
            name="amount"
            value="{{ "%.2f"|format(total_amount) }}"
        >


        <!-- Tax -->

        <input
            type="hidden"
            name="tax_amount"
            value="0"
        >


        <!-- Total amount -->

        <input
            type="hidden"
            name="total_amount"
            value="{{ "%.2f"|format(total_amount) }}"
        >


        <!-- Unique transaction ID -->

        <input
            type="hidden"
            name="transaction_uuid"
            value="{{ transaction_uuid }}"
        >


        <!-- eSewa product code -->

        <input
            type="hidden"
            name="product_code"
            value="{{ product_code }}"
        >


        <!-- Service charge -->

        <input
            type="hidden"
            name="product_service_charge"
            value="0"
        >


        <!-- Delivery charge -->

        <input
            type="hidden"
            name="product_delivery_charge"
            value="0"
        >


        <!-- Success URL -->

        <input
            type="hidden"
            name="success_url"
            value="{{ url_for('esewa_success', _external=True) }}"
        >


        <!-- Failure URL -->

        <input
            type="hidden"
            name="failure_url"
            value="{{ url_for('esewa_failure', _external=True) }}"
        >


        <!--
            THIS WAS THE MISSING FIELD.

            eSewa requires this field.
        -->

        <input
            type="hidden"
            name="signed_field_names"
            value="total_amount,transaction_uuid,product_code"
        >


        <!-- HMAC SHA256 signature -->

        <input
            type="hidden"
            name="signature"
            value="{{ signature }}"
        >


        <button
            type="submit"
            class="pay-button"
        >
            💳 Pay with eSewa
        </button>

    </form>


    <a
        href="{{ url_for('booking_details', booking_id=booking['id']) }}"
        class="cancel-button"
    >
        ← Back to Booking
    </a>


    <div class="notice">

        <strong>Test Mode</strong><br>

        This payment currently uses the
        eSewa UAT/test environment.

    </div>

</div>

</body>
</html>
